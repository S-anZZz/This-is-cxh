<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin :: head('登录')}"></head>
<body class="login-page">
<div class="login-card">
    <h1 th:text="${site?.siteTitle} ?: 'cxh 的博客'">cxh 的博客</h1>
    <p class="sub">登录后可以发文、点赞；管理员可进入后台</p>

    <div class="flash" th:if="${loginError}">账号或密码不正确，请重试。</div>
    <div class="flash" th:if="${codeError}" th:text="${codeError}">验证码不正确</div>
    <div class="flash" th:if="${loggedOut}">已安全退出。</div>
    <div class="flash flash--ok" th:if="${registered}" th:text="|注册成功，请用 「${registered}」 登录|">注册成功</div>
    <div class="flash flash--ok" th:if="${codeSent}" th:text="|验证码已发送到 ${codeSent}|">验证码已发送</div>
    <div class="flash flash--ok" th:if="${devCode}" th:text="|开发模式验证码：${devCode}|">验证码</div>

    <!-- 1) 用户名或邮箱 + 密码 -->
    <form th:action="@{/login}" method="post" class="form-grid">
        <div class="field">
            <label for="username">用户名或邮箱</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus="autofocus"/>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" autocomplete="current-password"/>
        </div>
        <button class="btn btn--block" type="submit">登录</button>
    </form>

    <div class="login-divider"><span>或使用邮箱验证码</span></div>

    <!-- 2) 邮箱 + 验证码；「获取验证码」用 formaction 提交到另一个地址，避免内联脚本 -->
    <form method="post" th:action="@{/login/code}" class="form-grid">
        <div class="field">
            <label for="codeEmail">邮箱</label>
            <input type="email" id="codeEmail" name="email" autocomplete="email"/>
        </div>
        <div class="field">
            <label for="code">验证码</label>
            <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"/>
        </div>
        <div class="login-actions">
            <button class="btn btn--ghost" type="submit" formaction="/login/code/request">获取验证码</button>
            <button class="btn" type="submit">验证码登录</button>
        </div>
    </form>

    <p class="small muted" style="margin-top:16px;">
        还没有账号？<a th:href="@{/register}">立即注册</a>
    </p>
</div>
</body>
</html>
