<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin :: head('注册')}"></head>
<body class="login-page">
<div class="login-card">
    <h1>创建账号</h1>
    <p class="sub">注册后可以发表文章、点赞</p>

    <form th:action="@{/register}" th:object="${form}" method="post" class="form-grid">
        <div class="field">
            <label for="username">用户名</label>
            <input type="text" id="username" th:field="*{username}" autocomplete="username"/>
            <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">错误</span>
        </div>
        <div class="field">
            <label for="email">邮箱</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email"/>
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">错误</span>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" th:field="*{password}" autocomplete="new-password"/>
            <span class="hint">至少 6 位</span>
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">错误</span>
        </div>
        <div class="field">
            <label for="confirmPassword">确认密码</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password"/>
            <span class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">错误</span>
        </div>
        <div class="field">
            <label for="captcha">验证码</label>
            <div class="captcha-row">
                <input type="text" id="captcha" th:field="*{captcha}" autocomplete="off"/>
                <img id="captcha-image" th:src="@{/captcha}" alt="验证码" width="120" height="40"/>
                <button type="button" class="btn btn--ghost btn--sm" id="captcha-refresh">换一张</button>
            </div>
            <span class="error" th:if="${#fields.hasErrors('captcha')}" th:errors="*{captcha}">错误</span>
        </div>
        <button class="btn btn--block" type="submit">注册</button>
    </form>

    <p class="small muted" style="margin-top:16px;">
        已有账号？<a th:href="@{/login}">去登录</a>
    </p>
</div>
<script th:src="@{/js/captcha-refresh.js}" defer="defer"></script>
</body>
</html>
