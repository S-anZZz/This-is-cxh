spring:
  application:
    name: cxh-blog

  # 默认使用 H2 文件库：零配置即可启动，数据保留在 ./data 目录
  # 表结构由 db/migration/h2 下的 Flyway 脚本创建
  datasource:
    url: jdbc:h2:file:./data/cxh-blog;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 表结构由 Flyway 版本化管理，Hibernate 只做校验（生产安全）
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  # 迁移脚本按数据库厂商分目录：{vendor} 由 Spring Boot 解析为 h2 / mysql
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    # 对已经由 ddl-auto 建过表的旧库，首次接入 Flyway 时打基线而不是报错
    baseline-on-migrate: true
    baseline-version: 0

  h2:
    console:
      enabled: true
      path: /h2-console

  # 开发期关闭模板缓存，改模板立即生效
  thymeleaf:
    cache: false

  # 图片上传：与 ImageStorage.MAX_BYTES（8MB）保持一致，超出时容器层先拒绝
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  web:
    resources:
      cache:
        period: 0

server:
  port: ${SERVER_PORT:8080}
  # 反向代理后能正确推导出站点地址（RSS / sitemap 的绝对链接依赖它）
  forward-headers-strategy: framework

cxh:
  media:
    # 上传目录：生产环境建议指到独立数据盘或挂载卷，并纳入备份
    location: ${CXH_MEDIA_LOCATION:./uploads}
    url-prefix: /uploads
    thumbnail-size: 560
    upload-enabled: true
  admin:
    # 生产环境请通过环境变量覆盖：export CXH_ADMIN_PASSWORD='...'
    username: ${CXH_ADMIN_USERNAME:admin}
    password: ${CXH_ADMIN_PASSWORD:cxh@2024}
    display-name: 站长
  seed:
    # 首次启动写入示例文章，方便直接看到效果
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.cxh.blog: INFO
