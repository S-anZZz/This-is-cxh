# 表单绑定失败的友好提示。
# Spring 默认的 typeMismatch 消息是英文技术描述（如 "Failed to convert property value..."），
# 直接展示在后台表单里对使用者毫无意义，这里按字段给出可读文案。
# 解析顺序：typeMismatch.<对象名>.<字段> → typeMismatch.<字段> → typeMismatch.<类型全名> → typeMismatch
typeMismatch.status=请选择有效的文章状态
typeMismatch.preset=请选择有效的预置主题
typeMismatch.headingFont=请选择有效的标题字体
typeMismatch.bodyFont=请选择有效的正文字体
typeMismatch.baseFontSize=请输入 12 到 26 之间的整数
typeMismatch.contentWidth=请输入 560 到 1600 之间的整数
typeMismatch.cornerRadius=请输入 0 到 40 之间的整数
typeMismatch.java.lang.Integer=请输入合法的整数
typeMismatch.java.lang.Long=请输入合法的数字
