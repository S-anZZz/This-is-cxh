# =====================================================================
# cxh 博客 · 生产环境编排（Nginx 反代 + 应用 + MySQL）
#
# 与根目录 docker-compose.yml 的区别：
#   * 应用**不对外发布端口**，只经 Nginx 暴露 80/443；
#   * 增加 Nginx 服务与证书/上传目录挂载；
#   * 上传图片与 MySQL 数据都落在具名卷，便于备份；
#   * 所有口令必须由 .env 提供，不设默认值（避免误用弱口令上线）。
#
# 用法：
#   cp deploy/.env.example deploy/.env   # 改里面的域名与口令
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# =====================================================================

name: cxh-blog-prod

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cxh-blog:1.0.0
    container_name: cxh-blog-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cxh_blog}
      DB_USERNAME: ${DB_USERNAME:-cxh}
      DB_PASSWORD: ${DB_PASSWORD:?必须在 .env 中设置 DB_PASSWORD}
      CXH_ADMIN_USERNAME: ${CXH_ADMIN_USERNAME:-admin}
      CXH_ADMIN_PASSWORD: ${CXH_ADMIN_PASSWORD:?必须在 .env 中设置 CXH_ADMIN_PASSWORD}
      # 上传目录（容器内路径），对应下面的 media-data 卷
      CXH_MEDIA_LOCATION: /app/uploads
      CXH_SEED_ENABLED: "false"
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Shanghai
    volumes:
      - media-data:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: cxh-blog-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/cxh-blog.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: cxh-blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cxh_blog}
      MYSQL_USER: ${DB_USERNAME:-cxh}
      MYSQL_PASSWORD: ${DB_PASSWORD:?必须在 .env 中设置 DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 可选：证书自动续期（首次签发见 README 部署章节）
  certbot:
    image: certbot/certbot:latest
    container_name: cxh-blog-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  mysql-data:
  media-data:
