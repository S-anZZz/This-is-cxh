# =====================================================================
# cxh 博客 · Nginx 反向代理配置模板
#
# 作用：
#   1) 对外只暴露 80/443，应用本身不直接对外（compose 里 app 不发布端口）；
#   2) 终结 HTTPS，并把真实协议/主机透传给应用（应用侧已开启
#      server.forward-headers-strategy=framework，RSS / sitemap 的绝对地址才正确）；
#   3) 静态图片与主题样式表在 Nginx 层缓存，减轻应用压力；
#   4) 限制请求体大小，与后端 8MB 图片上限呼应。
#
# 使用前替换：cxh.example.com → 你的域名；证书路径按实际情况调整。
# 证书可用 certbot 申请：certbot --nginx -d cxh.example.com
# =====================================================================

# 上游应用（compose 内服务名 app，容器端口 8080）
upstream cxh_blog {
    server app:8080;
    keepalive 16;
}

# HTTP：仅用于 ACME 校验与跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cxh.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cxh.example.com;

    # ---------- 证书 ----------
    ssl_certificate     /etc/letsencrypt/live/cxh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cxh.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 基础安全响应头（应用侧也会带，这里兜底）----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 请求体上限：与后端 8MB 图片上限呼应 ----------
    client_max_body_size 10m;

    # ---------- 压缩 ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/json application/javascript image/svg+xml;

    # ---------- 静态资源：直连应用但加长缓存 ----------
    # 主题样式表禁止缓存（后台改风格要立即生效）
    location = /theme.css {
        proxy_pass http://cxh_blog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # 上传的图片：内容寻址（UUID 文件名），可长缓存
    location /uploads/ {
        proxy_pass http://cxh_blog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /css/  { proxy_pass http://cxh_blog; expires 7d; add_header Cache-Control "public"; }
    location /js/   { proxy_pass http://cxh_blog; expires 7d; add_header Cache-Control "public"; }

    # ---------- 其余请求 ----------
    location / {
        proxy_pass http://cxh_blog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
