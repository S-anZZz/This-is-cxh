# =====================================================================
# cxh 博客 · cxh327.dpdns.org 站点配置（VPS + systemd 部署）
#
# 与 deploy/nginx/cxh-blog.conf（Docker compose 版）的区别：
#   * 上游是 127.0.0.1:8080（systemd 直接跑 jar），不是容器名 app:8080；
#   * server_name 已填好 cxh327.dpdns.org。
#
# 证书两种做法，任选其一：
#   A. 域名在 Cloudflare 走「代理(橙云)」：建议用 Cloudflare Origin Certificate，
#      把证书放到下面 ssl_certificate 指向的路径，SSL 模式选 Full (strict)。
#   B. 域名改为「仅 DNS(灰云)」：用 certbot 申请 Let's Encrypt：
#      certbot --nginx -d cxh327.dpdns.org
#
# 装好后：nginx -t && systemctl reload nginx
# =====================================================================

upstream cxh_blog_local {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ---------- HTTP：ACME 校验 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name cxh327.dpdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cxh327.dpdns.org;

    # 使用 Cloudflare Origin Certificate 时改成你的证书路径
    ssl_certificate     /etc/letsencrypt/live/cxh327.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cxh327.dpdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/cxh-blog.access.log;
    error_log  /var/log/nginx/cxh-blog.error.log warn;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 与后端 8MB 图片上限呼应
    client_max_body_size 10m;

    # ---------- 压缩 ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/json application/javascript image/svg+xml;

    # ---------- 转发头（应用侧已开 forward-headers-strategy=framework）----------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # 主题样式表必须实时：后台改风格要立刻生效
    location = /theme.css {
        proxy_pass http://cxh_blog_local;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # 上传的图片是 UUID 文件名，内容不会变，可以长缓存
    location /uploads/ {
        proxy_pass http://cxh_blog_local;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /css/ { proxy_pass http://cxh_blog_local; expires 7d; add_header Cache-Control "public"; }
    location /js/  { proxy_pass http://cxh_blog_local; expires 7d; add_header Cache-Control "public"; }

    location / {
        proxy_pass http://cxh_blog_local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
