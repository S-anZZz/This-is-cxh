# cxh 博客：应用 + MySQL 一键启动
#
#   docker compose up -d --build
#   # 前台 http://localhost:8080  后台 /admin（账号 admin / 密码见 CXH_ADMIN_PASSWORD）
#
# 首次启动时 app 会等 MySQL 健康后再起，随后由 Flyway 自动建表。
# 生产部署请通过环境变量覆盖下面的默认密码。

name: cxh-blog

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cxh-blog:1.0.0
    container_name: cxh-blog-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cxh_blog
      DB_USERNAME: cxh
      DB_PASSWORD: ${DB_PASSWORD:-cxh_pass}
      CXH_ADMIN_USERNAME: ${CXH_ADMIN_USERNAME:-admin}
      CXH_ADMIN_PASSWORD: ${CXH_ADMIN_PASSWORD:-cxh@2024}
      # 首次部署想写入示例文章，把这里改成 true（仅当文章表为空时生效）
      CXH_SEED_ENABLED: "false"
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: cxh-blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: cxh_blog
      MYSQL_USER: cxh
      MYSQL_PASSWORD: ${DB_PASSWORD:-cxh_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 默认只暴露给宿主机调试用；不需要时删掉这一段即可
      - "${DB_PORT_EXPOSED:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
